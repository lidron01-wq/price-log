<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0E5148">
<title>Price Log</title>
<style>
:root{--ink:#0E2E2C;--paper:#F6F3EA;--line:#D8D2BF;--teal:#0E5148;--dim:#3E6E67;--coral:#E0623F;--card:#FFFEFA;--good:#1E6B4F}
@media(prefers-color-scheme:dark){:root{--ink:#EDEAE0;--paper:#101817;--line:#2A3634;--teal:#5FBBA9;--dim:#8FA9A4;--coral:#F0876A;--card:#16201F;--good:#4FCB9A}}
*{box-sizing:border-box}html{height:100%}body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{padding:28px 20px 18px;border-bottom:1px solid var(--line)}h1{margin:0 0 4px;font:600 28px Georgia,serif}header p{margin:0;color:var(--dim);font-size:14px}
main{max-width:700px;margin:auto;padding:18px 16px 60px}.card,.item-group,.shop-card,.month-card,.stat-card,.chart-card,.recent{background:var(--card);border:1px solid var(--line);border-radius:12px}
.card{padding:16px;margin-bottom:16px}.row{display:flex;gap:10px;flex-wrap:wrap}.field{flex:1;min-width:130px;display:flex;flex-direction:column;gap:4px}label{font-size:12px;color:var(--dim)}
input,select,textarea{font:16px -apple-system,sans-serif;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink);width:100%}
.btnrow{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}button{font:600 14px -apple-system,sans-serif;border:0;border-radius:8px;padding:11px 15px;cursor:pointer}
.primary{background:var(--teal);color:var(--paper);flex:1}.ghost{background:transparent;color:var(--teal);border:1px solid var(--teal)}.danger{color:#b33;background:transparent;border:1px solid #b33}.small{padding:7px 10px;font-size:12px}
.status{font-size:13px;color:var(--dim);margin-top:9px}.preview{display:none;width:100%;max-height:300px;object-fit:contain;margin-top:10px;border:1px solid var(--line);border-radius:8px}
/* Modern tab navigation */
.tabs{display:flex;gap:7px;overflow-x:auto;overflow-y:hidden;margin:20px 0 16px;padding:6px;background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:0 3px 14px #00000008;scrollbar-width:none;-webkit-overflow-scrolling:touch;position:sticky;top:8px;z-index:10;backdrop-filter:blur(12px)}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;display:flex;align-items:center;justify-content:center;gap:7px;min-height:44px;padding:8px 12px;background:transparent;color:var(--dim);border:1px solid transparent;border-radius:11px;white-space:nowrap;font:600 12px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;transition:all .18s ease;box-shadow:none}
.tab .tab-icon{font-size:17px;line-height:1}
.tab .tab-label{line-height:1}
.tab.active{color:var(--card);background:var(--teal);border-color:var(--teal);box-shadow:0 4px 10px #00000018}
.tab:active{transform:scale(.97)}
@media(max-width:520px){
 .tabs{gap:5px;padding:5px;margin-left:-2px;margin-right:-2px;border-radius:14px;top:5px}
 .tab{min-width:76px;padding:8px 10px;gap:5px;font-size:11px;flex-direction:column;min-height:48px}
 .tab .tab-icon{font-size:18px}
}
@media(min-width:521px){.tab{min-width:100px}.tab:first-child{min-width:112px}}

.empty{color:var(--dim);font-size:14px;padding:20px 4px}.category-head{font-size:13px;font-weight:700;color:var(--coral);margin:18px 2px 8px}.item-group{overflow:hidden;margin-bottom:12px}.item-head{padding:12px 14px;font-weight:700;border-bottom:1px solid var(--line)}.entry{display:flex;justify-content:space-between;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);font-size:14px}.entry:last-child{border:0}.date{color:var(--dim);font-size:11px}.price{font-weight:700}.entry-actions{display:flex;gap:5px;align-items:center}.entry-actions button{padding:5px 8px;font-size:12px}
.candidates{margin-top:12px}.cand{display:flex;align-items:center;gap:7px;padding:9px;margin-top:6px;border:1px solid var(--line);border-radius:8px;background:var(--paper)}.cand.new{border-color:var(--good)}.cand-text{flex:1;overflow:hidden;text-overflow:ellipsis}.cand-price{font-weight:700;white-space:nowrap}.badge{font-size:10px;padding:3px 5px;border-radius:5px;background:var(--good);color:white}
.billbox{margin-top:12px;border-top:1px solid var(--line);padding-top:12px}.billrow{display:flex;justify-content:space-between;padding:4px 0}.billrow.total{font-weight:800;font-size:17px;border-top:1px solid var(--line);margin-top:5px;padding-top:9px}
.stat-grid{display:flex;gap:10px;flex-wrap:wrap}.stat-card{flex:1;min-width:140px;padding:14px}.num{font-size:21px;font-weight:800;color:var(--teal)}.lbl{font-size:12px;color:var(--dim);margin-top:2px}.shop-grid{display:flex;flex-wrap:wrap;gap:10px}.shop-card{flex:1;min-width:160px;padding:13px}.shop-card .name{font-weight:700}.shop-card .stat{font-size:12px;color:var(--dim);margin-top:3px}.month-card{display:flex;justify-content:space-between;padding:14px;margin-bottom:9px}.month-card .count{display:block;font-size:12px;color:var(--dim);margin-top:3px}.recent{overflow:hidden}.recent div{display:flex;justify-content:space-between;padding:10px 14px;border-bottom:1px solid var(--line);font-size:13px}.recent div:last-child{border:0}
.modal{display:none;position:fixed;inset:0;background:#0008;z-index:20;align-items:flex-end;justify-content:center}.modal.open{display:flex}.modalbox{width:min(700px,100%);background:var(--card);border-radius:16px 16px 0 0;padding:18px;max-height:90vh;overflow:auto}.modal h3{margin-top:0}
.notice{padding:10px;border-radius:8px;background:color-mix(in srgb,var(--coral) 15%,transparent);font-size:13px;margin-top:10px}

.search-card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:16px}
.search-title{font:700 14px -apple-system,sans-serif;margin-bottom:7px}
.search-results{margin-top:10px}
.search-result{padding:11px 0;border-top:1px solid var(--line)}
.search-result:first-child{border-top:0}
.search-item-title{font-weight:700;margin-bottom:5px}
.shop-price{display:flex;justify-content:space-between;gap:10px;font-size:13px;padding:3px 0}
.shop-price .cheap{color:var(--good);font-weight:800}
.match-note{font-size:12px;color:var(--dim);margin-top:3px}
.list-card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:12px}
.list-upload{display:flex;gap:8px;flex-wrap:wrap}
.list-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.list-stat{background:var(--paper);border:1px solid var(--line);border-radius:9px;padding:10px;text-align:center}
.list-stat b{display:block;font-size:18px;color:var(--teal)}
.list-stat span{font-size:11px;color:var(--dim)}
.compare-shop{border:1px solid var(--line);border-radius:10px;padding:12px;margin-top:8px;background:var(--paper)}
.compare-shop.top{border-color:var(--good)}
.compare-shop .shop-name{font-weight:800}
.compare-items{margin-top:8px;font-size:12px;color:var(--dim)}
.category-badge{display:inline-block;font-size:10px;padding:3px 6px;border-radius:5px;background:var(--paper);border:1px solid var(--line);color:var(--dim);margin-left:5px;vertical-align:middle}
.receipt-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}.receipt-card{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}.receipt-thumb{width:100%;height:190px;object-fit:cover;background:var(--paper);display:block}.receipt-meta{padding:10px}.receipt-meta b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.receipt-meta small{display:block;color:var(--dim);margin-top:3px}.receipt-actions{display:flex;gap:6px;margin-top:8px}.receipt-actions button{flex:1;padding:7px 8px;font-size:12px}
</style>
</head>
<body>
<header><h1>Price Log</h1><p>Track what things cost at different shops, from scanned bills or by hand.</p></header>
<main>
<div class="search-card">
  <div class="search-title">Find the cheapest price</div>
  <input id="itemSearch" placeholder="Search an item, e.g. milk, shampoo, chicken..." autocomplete="off">
  <div class="search-results" id="searchResults"></div>
</div>
<div class="card">
<div class="row">
<div class="field"><label>Item</label><input id="item" placeholder="e.g. Rice 5kg"></div>
<div class="field"><label>Category</label><input id="category" list="categoryList" placeholder="e.g. Groceries"><datalist id="categoryList"></datalist></div>
</div>
<div class="row" style="margin-top:10px">
<div class="field"><label>Shop</label><input id="shop" placeholder="e.g. STO"></div>
<div class="field"><label>Price (MVR)</label><input id="price" type="number" step="0.01" inputmode="decimal" placeholder="0.00"></div>
</div>
<div class="row" style="margin-top:10px"><div class="field"><label>Date</label><input id="date" type="date"></div></div>
<div class="btnrow"><button class="primary" id="addBtn">Add entry</button><button class="ghost" id="editBtn">Edit</button></div>
<div class="btnrow"><button class="ghost" id="scanBtn">📷 Scan a bill</button><button class="ghost" id="uploadBtn">🖼 Upload bill</button></div>
<input id="cameraInput" type="file" accept="image/*" capture="environment" hidden>
<input id="uploadInput" type="file" accept="image/*" hidden>
<div class="status" id="status">After scanning, you can amend the shop name before adding items.</div><img id="preview" class="preview" alt="Receipt preview">
<div id="billInfo"></div><div id="candidates" class="candidates"></div>
</div>

<nav class="tabs" aria-label="Price Log sections">
  <button class="tab active" data-tab="dash" role="tab" aria-selected="true"><span class="tab-icon">⌂</span><span class="tab-label">Overview</span></button>
  <button class="tab" data-tab="items" role="tab" aria-selected="false"><span class="tab-icon">▦</span><span class="tab-label">Items</span></button>
  <button class="tab" data-tab="shops" role="tab" aria-selected="false"><span class="tab-icon">⌖</span><span class="tab-label">Shops</span></button>
  <button class="tab" data-tab="spending" role="tab" aria-selected="false"><span class="tab-icon">◒</span><span class="tab-label">Spending</span></button>
  <button class="tab" data-tab="shopping" role="tab" aria-selected="false"><span class="tab-icon">🛒</span><span class="tab-label">Shopping</span></button>
  <button class="tab" data-tab="receipts" role="tab" aria-selected="false"><span class="tab-icon">🧾</span><span class="tab-label">Receipts</span></button>
</nav>
<section id="dash"></section><section id="items" style="display:none"></section><section id="shops" style="display:none"></section><section id="spending" style="display:none"></section><section id="shopping" style="display:none"></section><section id="receipts" style="display:none"></section>
</main>

<div id="modal" class="modal"><div class="modalbox"><h3 id="modalTitle">Edit entry</h3><div class="row"><div class="field"><label>Item</label><input id="mItem"></div><div class="field"><label>Category</label><input id="mCat"></div></div><div class="row" style="margin-top:10px"><div class="field"><label>Shop</label><input id="mShop"></div><div class="field"><label>Price</label><input id="mPrice" type="number" step=".01"></div></div><div class="field" style="margin-top:10px"><label>Date</label><input id="mDate" type="date"></div><div class="btnrow"><button class="primary" id="saveEdit">Save changes</button><button class="ghost" id="cancelEdit">Cancel</button></div></div></div>

<script>
"use strict";
const KEY="price-log-entries-v1";
const BILL_KEY="price-log-bills-v1";
const SHOPPING_KEY="price-log-shopping-v1";
const RECEIPT_DB="price-log-receipts-v1";
const RECEIPT_STORE="receipts";
let receiptDB=null;
let bills=[];
let entries=[], scanEntries=[], currentEdit=-1, currentBill=null;
let shoppingItems=[];

const $=id=>document.getElementById(id);
function esc(v){return String(v??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function openReceiptDB(){
 return new Promise((resolve,reject)=>{
  if(receiptDB){resolve(receiptDB);return}
  if(!window.indexedDB){reject(new Error("IndexedDB unavailable"));return}
  const req=indexedDB.open(RECEIPT_DB,1);
  req.onupgradeneeded=e=>{const db=e.target.result;if(!db.objectStoreNames.contains(RECEIPT_STORE)){const store=db.createObjectStore(RECEIPT_STORE,{keyPath:"id"});store.createIndex("billId","billId",{unique:false});store.createIndex("date","date",{unique:false});}};
  req.onsuccess=e=>{receiptDB=e.target.result;resolve(receiptDB)};
  req.onerror=()=>reject(req.error||new Error("Could not open receipt storage"));
 });
}
async function saveReceiptRecord(file,meta={}){
 try{const db=await openReceiptDB();const id=meta.id||crypto.randomUUID();const record={id,billId:meta.billId||"",shop:meta.shop||"Unknown shop",date:meta.date||today(),total:Number(meta.total)||0,subtotal:Number(meta.subtotal)||0,tax:Number(meta.tax)||0,createdAt:meta.createdAt||Date.now(),blob:file};await new Promise((resolve,reject)=>{const tx=db.transaction(RECEIPT_STORE,"readwrite");tx.objectStore(RECEIPT_STORE).put(record);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)});return id}catch(e){console.warn("Receipt could not be stored",e);return null}
}
async function listReceipts(){try{const db=await openReceiptDB();return await new Promise((resolve,reject)=>{const req=db.transaction(RECEIPT_STORE,"readonly").objectStore(RECEIPT_STORE).getAll();req.onsuccess=()=>resolve((req.result||[]).sort((a,b)=>b.createdAt-a.createdAt));req.onerror=()=>reject(req.error)})}catch(e){return []}}
async function deleteReceiptRecord(id){try{const db=await openReceiptDB();await new Promise((resolve,reject)=>{const tx=db.transaction(RECEIPT_STORE,"readwrite");tx.objectStore(RECEIPT_STORE).delete(id);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)});renderReceipts()}catch(e){alert("Could not delete the saved receipt.")}}
async function renderReceipts(){
 const box=$("receipts");if(!box)return;
 box.innerHTML='<div class="list-card"><h3 style="margin-top:0">Saved receipts</h3><div class="match-note">Receipt images are stored on this device in this browser for future reference.</div><div id="receiptList" class="receipt-grid" style="margin-top:12px"><div class="match-note">Loading receipts…</div></div></div>';
 const list=await listReceipts(),grid=$("receiptList");
 if(!list.length){grid.innerHTML='<div class="empty">No receipts saved yet. Scan or upload a bill and it will appear here.</div>';return}
 grid.innerHTML=list.map(r=>{const u=URL.createObjectURL(r.blob);return `<div class="receipt-card"><a href="${u}" target="_blank" rel="noopener"><img class="receipt-thumb" src="${u}" alt="Saved receipt"></a><div class="receipt-meta"><b>${esc(r.shop)}</b><small>${esc(r.date)}${r.total?` · MVR ${r.total.toFixed(2)}`:""}</small><div class="receipt-actions"><button class="ghost" type="button" data-open-receipt="${esc(r.id)}">View</button><button class="danger" type="button" data-delete-receipt="${esc(r.id)}">Delete</button></div></div></div>`}).join("");
 grid.querySelectorAll("[data-open-receipt]").forEach(btn=>btn.addEventListener("click",async()=>{const rows=await listReceipts(),r=rows.find(x=>x.id===btn.dataset.openReceipt);if(r)window.open(URL.createObjectURL(r.blob),"_blank")}));
 grid.querySelectorAll("[data-delete-receipt]").forEach(btn=>btn.addEventListener("click",()=>{if(confirm("Delete this saved receipt?"))deleteReceiptRecord(btn.dataset.deleteReceipt)}));
}
async function updateSavedReceiptMeta(){
 if(!currentBill?.receiptId)return;
 try{const db=await openReceiptDB(),rows=await listReceipts(),r=rows.find(x=>x.id===currentBill.receiptId);if(!r)return;r.billId=currentBill.id||"";r.shop=currentBill.shop||r.shop;r.date=currentBill.date||r.date;r.total=Number(currentBill.total)||0;r.subtotal=Number(currentBill.subtotal)||0;r.tax=Number(currentBill.tax)||0;await new Promise((resolve,reject)=>{const tx=db.transaction(RECEIPT_STORE,"readwrite");tx.objectStore(RECEIPT_STORE).put(r);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)});renderReceipts()}catch(e){console.warn("Could not update saved receipt",e)}
}

function load(){
 try{entries=JSON.parse(localStorage.getItem(KEY)||"[]");if(!Array.isArray(entries))entries=[]}catch(e){entries=[]}
 try{bills=JSON.parse(localStorage.getItem(BILL_KEY)||"[]");if(!Array.isArray(bills))bills=[]}catch(e){bills=[]}
 try{shoppingItems=JSON.parse(localStorage.getItem(SHOPPING_KEY)||"[]");if(!Array.isArray(shoppingItems))shoppingItems=[]}catch(e){shoppingItems=[]}
}
function save(){localStorage.setItem(KEY,JSON.stringify(entries))}
function saveBills(){localStorage.setItem(BILL_KEY,JSON.stringify(bills))}
function saveShopping(){localStorage.setItem(SHOPPING_KEY,JSON.stringify(shoppingItems))}
function billId(b){
 return `${(b.shop||"").toLowerCase().trim()}|${b.date||""}|${Number(b.total||0).toFixed(2)}|${Number(b.subtotal||0).toFixed(2)}`;
}
function billSpend(b){
 const explicit=Number(b.total);
 if(Number.isFinite(explicit) && explicit>0) return explicit;
 let n=Number(b.subtotal||0);
 if(!n)n=Number(b.itemTotal||0);
 n+=Number(b.tax||0);
 n-=Number(b.discount||0);
 n-=Number(b.pointsUsed||0);
 return Math.max(0,n);
}
function upsertBill(){
 if(!currentBill)return;
 currentBill.shop=(currentBill.shop||$("shop").value.trim()||"Unknown shop").trim();
 currentBill.id=currentBill.id||billId(currentBill);
 const existing=bills.findIndex(b=>b.id===currentBill.id);
 const record={
   id:currentBill.id,shop:currentBill.shop,date:currentBill.date,
   subtotal:currentBill.subtotal,tax:currentBill.tax,total:currentBill.total,
   discount:currentBill.discount,pointsUsed:currentBill.pointsUsed,
   itemTotal:scanEntries.reduce((a,x)=>a+Number(x.price||0),0)
 };
 if(existing>=0)bills[existing]=record;else bills.push(record);
 saveBills();
}
function today(){return new Date().toISOString().slice(0,10)}

$("date").value=today();

function autoCategory(item){
 const s=String(item||"").toLowerCase();
 if(/\b(chicken|broiler|wing|wings|drumstick|thigh|breast|nugget|tender|chicken\s*sausage)\b/.test(s))return "Chicken";
 if(/\b(beef|steak|mince|ground\s*beef|mutton|lamb|veal|pork|meat|sausage|burger\s*patty)\b/.test(s))return "Meat";
 if(/\b(shampoo|conditioner|soap|face\s*wash|facial|moisturizer|moisturiser|cream|lotion|serum|makeup|foundation|lipstick|mascara|deodorant|perfume|cosmetic|toothpaste|toothbrush|sunscreen|razor|sanitary|skincare|skin\s*care)\b/.test(s))return "Cosmetics";
 if(/\b(milk|bread|rice|flour|sugar|salt|oil|butter|cheese|egg|eggs|pasta|noodle|cereal|oat|biscuit|wafer|juice|coffee|tea|sauce|spice|canned|coconut|water|snack|chocolate|food)\b/.test(s))return "Grocery";
 if(/\b(fish|tuna|sardine|mackerel|reef|seafood|prawn|shrimp)\b/.test(s))return "Fish & Seafood";
 if(/\b(detergent|bleach|cleaner|dishwash|dish\s*wash|sponge|tissue|napkin|serviette|trash\s*bag|garbage\s*bag)\b/.test(s))return "Household";
 if(/\b(diaper|nappy|baby|infant|formula)\b/.test(s))return "Baby";
 return "Other";
}
function applyAutoCategories(){
 let changed=false;
 entries.forEach(e=>{if(!e.category||/^(uncategorized|other)$/i.test(e.category)){const c=autoCategory(e.item);if(c!==e.category){e.category=c;changed=true}}});
 if(changed)save();
}
function normItem(s){
 return String(s||"").toLowerCase().replace(/[^a-z0-9\s]/g," ").replace(/\s+/g," ").trim()
}
function itemMatch(a,b){
 const x=normItem(a),y=normItem(b);
 if(!x||!y)return false;
 if(x===y||x.includes(y)||y.includes(x))return true;
 const A=new Set(x.split(" ").filter(w=>w.length>2)),B=new Set(y.split(" ").filter(w=>w.length>2));
 const inter=[...A].filter(w=>B.has(w)).length;
 return inter>=2 && inter/Math.min(A.size,B.size)>=0.55;
}
function renderItemSearch(){
 const q=$("itemSearch").value.trim();
 const box=$("searchResults");
 if(!q){box.innerHTML='<div class="match-note">Type an item to compare prices across your recorded shops.</div>';return}
 const matches=entries.filter(e=>itemMatch(e.item,q));
 if(!matches.length){box.innerHTML='<div class="match-note">No matching item found in your price log.</div>';return}
 const groups={};
 matches.forEach(e=>{const k=normItem(e.item);(groups[k]??=[]).push(e)});
 box.innerHTML=Object.values(groups).map(rows=>{
   const min=Math.min(...rows.map(e=>Number(e.price)));
   const label=rows[0].item;
   const unique={};
   rows.forEach(e=>{if(!unique[e.shop]||e.price<unique[e.shop].price)unique[e.shop]=e});
   const shopRows=Object.values(unique).sort((a,b)=>a.price-b.price);
   return `<div class="search-result"><div class="search-item-title">${esc(label)} <span class="category-badge">${esc(rows[0].category||autoCategory(label))}</span></div>
   ${shopRows.map(e=>`<div class="shop-price"><span>${esc(e.shop)}</span><span class="${e.price===min?'cheap':''}">MVR ${Number(e.price).toFixed(2)} ${e.price===min?'· cheapest':''}</span></div>`).join("")}</div>`
 }).join("");
}


function render(){
 renderItems();renderShops();renderSpending();renderDash();renderCats();
}
function renderCats(){$("categoryList").innerHTML=[...new Set(entries.map(e=>e.category).filter(Boolean))].sort().map(x=>`<option value="${esc(x)}">`).join("")}

$("addBtn").onclick=()=>{
 const item=$("item").value.trim(),shop=$("shop").value.trim(),price=parseFloat($("price").value),date=$("date").value||today(),category=$("category").value.trim();
 if(!item||!shop||!Number.isFinite(price)){ $("status").textContent="Fill in item, shop and price.";return}
 entries.push({item,category:category||autoCategory(item),shop,price,date});
 save();render();$("item").value="";$("shop").value="";$("price").value="";$("status").textContent="Added.";
};
$("editBtn").onclick=()=>openEdit(-1,true);

function openEdit(i,fromForm=false){
 if(fromForm){
  if(!$("item").value.trim()){$("status").textContent="Enter an item first, or select Edit beside an existing entry.";return}

function parseShoppingText(text){

   .map(x=>x.replace(/^[-•*]\s*/,"").replace(/^\d+\s*[xX×]\s*/,"").trim())
   .filter((x,i,a)=>a.findIndex(y=>y.toLowerCase()===x.toLowerCase())===i);
}

}

function moneyNumbers(s){return [...s.matchAll(/(?:MVR\s*)?(\d{1,5}(?:[.,]\d{2}))/gi)].map(m=>parseFloat(m[1].replace(",",".")))}
function guessDate(text){const m=text.match(/\b(\d{1,2})[-\/](\d{1,2})[-\/](\d{2,4})\b/);if(!m)return today();let y=m[3];if(y.length===2)y="20"+y;return `${y}-${m[2].padStart(2,"0")}-${m[1].padStart(2,"0")}`}
function guessShop(lines){
 const bad=/^(date|time|invoice|bill|receipt|subtotal|total|cash|change|tax|gst|qty|item|description|amount|register|cashier|type|temp|tin|phone|email|customer|print|powered|tax invoice|bill no)/i;
 const header=lines.slice(0,18).filter(x=>x.length>4&&!bad.test(x)&&/[A-Za-z]/.test(x)&&!/@/.test(x));
 const score=x=>{
   const letters=(x.match(/[A-Za-z]/g)||[]).length;
   const upper=(x.match(/[A-Z]/g)||[]).length;
   const words=x.split(/\s+/).length;
   const address=/vinare|hulhumale|malé|male|phone|mob|road|street|atoll/i.test(x);
   return (upper/Math.max(1,letters))*4 + Math.min(words,4)*.35 - (address?2:0) - (/[0-9]{2,}/.test(x)?2:0);
 };
 return header.sort((a,b)=>score(b)-score(a))[0]||$("shop").value.trim()||"Unknown shop";
}

function duplicateKey(c){
 return `${(c.shop||"").toLowerCase()}|${c.date||""}|${(c.item||"").toLowerCase().replace(/\W/g,"")}|${Number(c.price).toFixed(2)}`
}
function alreadyExists(c){
 return entries.some(e=>duplicateKey(e)===duplicateKey(c));
}

function parseReceipt(text){
 text=fixOcrDigits(text);
 const lines=text.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);
 const date=guessDate(text);
 let subtotal=null,tax=null,total=null,discount=null,pointsUsed=null,paymentAmount=null;
 for(const line of lines){
  const low=line.toLowerCase(), nums=moneyNumbers(line); if(!nums.length)continue;
  if(/sub\s*total/.test(low)) subtotal=nums[nums.length-1];
  else if(/\btotal\s*gst\b|\bgst\b|\btax\b|\bvat\b/.test(low) && !/subtotal/.test(low)) tax=nums[nums.length-1];
  else if(/\b(discount|disc)\b/.test(low)) discount=nums[nums.length-1];
  else if(/\bpoints?\s*(used|redeemed)|\b(loyalty|reward)\s*(used|redeemed)|\b(redeem|redeemed|redemption)\b/.test(low)){
    if(/used|redeemed|redemption|redeem/.test(low))pointsUsed=nums[nums.length-1];
  } else if(/\btotal\s*(?:\(\s*mvr\s*\)|mvr)?\b/i.test(low) && !/subtotal|total\s*gst|total\s*tax/.test(low)) total=nums[nums.length-1];
  else if(/\b(received|paid|payment|cash|settled)\b/.test(low) && !/outstanding|balance/.test(low)) paymentAmount=nums[nums.length-1];
 }
 if(total==null&&paymentAmount!=null)total=paymentAmount;
 if(total==null&&subtotal!=null)total=Math.max(0,subtotal+(tax||0)-(discount||0)-(pointsUsed||0));

 const cleanName=s=>String(s||'').replace(/^[\s|_\-–—:.,]+|[\s|_\-–—:.,]+$/g,'').replace(/\s+/g,' ').trim();
 const badShop=/^(date|time|invoice|bill|receipt|subtotal|sub\s*total|total|cash|change|tax|gst|qty|item|description|amount|register|cashier|type|temp|tin|phone|email|customer|print|powered|tax invoice|bill no|ph:|mb:|tel:|vinare|tin\s*:)/i;
 function detectShop(){
   const top=lines.slice(0,12);
   const preferred=top.filter(x=>!badShop.test(x)&&!/[0-9]{5,}/.test(x)&&/[A-Za-z]{3}/.test(x));
   // Strong shop-name signals first.
   const strong=preferred.find(x=>/\b(day\s*night\s*mart|mart|market|store|shop|fihaara|fithaara|supermarket)\b/i.test(x));
   if(strong)return cleanName(strong);
   // Otherwise prefer a short, mostly-uppercase first business-looking line.
   const scored=preferred.map(x=>{const letters=(x.match(/[A-Za-z]/g)||[]).length;const upper=(x.match(/[A-Z]/g)||[]).length;return {x,score:(upper/Math.max(1,letters))*4-Math.max(0,x.length-28)*.05}}).sort((a,b)=>b.score-a.score);
   return scored[0]?.x||$('shop').value.trim()||'Unknown shop';
 }
 const shop=detectShop();

 const stopItem=/^(sub\s*total|discount|total\s*gst|plastic\s*bag|total\s*amount|received\s*amount|balance|outstanding|settled|thank|powered\s*by|print\s*by|card|cash|payment)/i;
 const noiseName=/^(sn|qty|a\.?\s*rate|s\.?\s*rate|amount|gst|item|description|total|subtotal|discount|customer|bill|date|time|register|cashier)$/i;
 const numericTokens=s=>String(s||'').match(/\d+(?:[.,]\d+)?/g)||[];
 const toNum=s=>parseFloat(String(s).replace(',','.'));
 const isNumLine=s=>numericTokens(s).length>=3 && (/[0-9]/.test(s));
 const looksName=s=>{
   s=cleanName(s);
   if(s.length<4||stopItem.test(s)||noiseName.test(s)||!/[A-Za-z]{3}/.test(s))return false;
   const digits=(s.match(/\d/g)||[]).length;
   return digits/s.length<0.35;
 };
 const makeCandidate=(name,price,qty,lineTotal,gst)=>{
   name=cleanName(name); price=Number(price);
   if(!looksName(name)||!Number.isFinite(price)||price<=0||price>=100000)return null;
   const c={item:name,shop,date,price,qty:Number.isFinite(Number(qty))?Number(qty):null,lineTotal:Number.isFinite(Number(lineTotal))?Number(lineTotal):null,gst:Number.isFinite(Number(gst))?Number(gst):null};
   c.added=alreadyExists(c); return c;
 };

 // ---------- FORMAT 1: Ihsaan / POS table ----------
 // Header is SN | Qty | A.Rate | S.Rate | Amount | GST.
 // A.Rate is ALWAYS the stored item price. SN only identifies the item row.
 let header=-1;
 for(let i=0;i<lines.length;i++){
   if(/\bsn\b/i.test(lines[i])&&/qty/i.test(lines[i])&&/a\.?\s*rate/i.test(lines[i])){header=i;break;}
 }
 const found=[];
 if(header>=0){
   for(let i=header+1;i<lines.length;i++){
     if(stopItem.test(lines[i]))break;
     const nums=numericTokens(lines[i]).map(toNum);
     // Typical OCR row: SN Qty A.Rate S.Rate Amount GST = 6 numeric tokens.
     if(nums.length<5||nums.length>7)continue;
     const sn=nums[0];
     if(!Number.isInteger(sn)||sn<1||sn>999)continue;
     let qty=null,arate=null,srate=null,amount=null,gst=null;
     if(nums.length>=6){qty=nums[1];arate=nums[2];srate=nums[3];amount=nums[4];gst=nums[5];}
     else {qty=nums[1];arate=nums[2];srate=nums[2];amount=nums[3];gst=nums[4];}
     // The next meaningful line is the product name. Ignore dotted separator lines.
     let name='';
     for(let j=i+1;j<=Math.min(i+3,lines.length-1);j++){
       if(stopItem.test(lines[j]))break;
       if(isNumLine(lines[j]))continue;
       if(looksName(lines[j])){name=lines[j];break;}
     }
     const c=makeCandidate(name,arate,qty,amount,gst);
     if(c&&!found.some(x=>x.item.toLowerCase()===c.item.toLowerCase()))found.push(c);
   }
 }

 // ---------- FORMAT 2: Day Night Mart / simple Item-QTY-Total ----------
 // Typical row is PRODUCT NAME + Qty (pcs/kg/etc) + line total. For Qty > 1,
 // Price Log stores the per-unit price = line total / quantity.
 if(found.length<3){
   const itemHeader=lines.findIndex(x=>/\bitem\b/i.test(x)&&/\bqty\b/i.test(x)&&/\btotal\b/i.test(x));
   const start=itemHeader>=0?itemHeader+1:0;
   for(let i=start;i<lines.length;i++){
     if(stopItem.test(lines[i]))break;
     let name='',qty=null,lineTotal=null;
     const same=lines[i].match(/^(.+?)\s+(\d+(?:\.\d+)?)\s*(?:pcs?|pc|kg|g|ml|l)?\s+(\d+(?:[.,]\d{2}))\s*$/i);
     if(same){name=cleanName(same[1]);qty=toNum(same[2]);lineTotal=toNum(same[3]);}
     else if(looksName(lines[i])){
       // Search the next two lines for the quantity/total pair.
       for(let j=i+1;j<=Math.min(i+2,lines.length-1);j++){
         const toks=numericTokens(lines[j]).map(toNum);
         if(toks.length>=2){
           qty=toks[0];lineTotal=toks[toks.length-1];break;
         }
       }
       name=cleanName(lines[i]);
     }
     if(!name||!Number.isFinite(lineTotal)||!Number.isFinite(qty)||qty<=0)continue;
     const unit=lineTotal/qty;
     const c=makeCandidate(name,unit,qty,lineTotal,null);
     if(c&&!found.some(x=>x.item.toLowerCase()===c.item.toLowerCase()))found.push(c);
   }
 }

 // ---------- Fallback ----------
 if(!found.length){
   for(let i=0;i<lines.length;i++){
     if(!looksName(lines[i]))continue;
     for(let j=i+1;j<=Math.min(i+2,lines.length-1);j++){
       const nums=numericTokens(lines[j]).map(toNum);
       if(nums.length>=2){
         const qty=nums[0],amount=nums[nums.length-1],price=qty>0?amount/qty:amount;
         const c=makeCandidate(lines[i],price,qty,amount,null);
         if(c){found.push(c);break;}
       }
     }
   }
 }
 return {shop,date,subtotal,tax,discount,pointsUsed,total,items:dedupe(found)};
}
function dedupe(a){const seen=new Set();return a.filter(x=>{const k=duplicateKey(x);if(seen.has(k))return false;seen.add(k);return true})}

function addScannedItems(missingOnly){
 if(!scanEntries.length)return;
 const pending=scanEntries.filter(x=>!x.added);
 if(!pending.length){$('status').textContent='No missing items to add.';renderScan();return}
 let added=0;
 const billShop=(currentBill?.shop||$('shop').value.trim()||'Unknown shop').trim();
 pending.forEach(x=>{
   const shop=(x.shop||billShop).trim();
   const candidate={item:x.item,category:x.category||autoCategory(x.item),shop,price:Number(x.price),date:x.date||currentBill?.date||today(),sourceBillId:currentBill?.id||null};
   const duplicate=entries.some(e=>duplicateKey(e)===duplicateKey(candidate));
   if(!duplicate){entries.push(candidate);added++;}
   x.added=true;x.shop=shop;
 });
 save();
 if(currentBill){currentBill.shop=billShop;currentBill.id=billId(currentBill);upsertBill();}
 render();
 renderScan();
 $('status').textContent=missingOnly?`Added ${added} missing item(s) from the scanned bill.`:`Added ${added} item(s) from the scanned bill.`;
}
function addCandidate(i){
 const x=scanEntries[i];
 if(!x||x.added)return;
 const shop=(x.shop||currentBill?.shop||$('shop').value.trim()||'Unknown shop').trim();
 const candidate={item:x.item,category:x.category||autoCategory(x.item),shop,price:Number(x.price),date:x.date||currentBill?.date||today(),sourceBillId:currentBill?.id||null};
 if(!entries.some(e=>duplicateKey(e)===duplicateKey(candidate)))entries.push(candidate);
 x.added=true;x.shop=shop;
 save();
 if(currentBill)upsertBill();
 render();
 renderScan();
 $('status').textContent=`Added ${x.item}.`;
}
function editCandidate(i){
 const x=scanEntries[i];currentEdit=-1;$("mItem").value=x.item;$("mCat").value=$("category").value;$("mShop").value=x.shop;$("mPrice").value=x.price;$("mDate").value=x.date;$("modal").classList.add("open");
 $("saveEdit").onclick=()=>{x.item=$("mItem").value.trim();x.shop=$("mShop").value.trim();x.price=parseFloat($("mPrice").value);x.date=$("mDate").value||today();x.category=$("mCat").value.trim();x.added=alreadyExists(x);if(!x.added){entries.push({item:x.item,category:x.category,shop:x.shop,price:x.price,date:x.date,sourceBillId:currentBill?.id||null});x.added=true;upsertBill();save();render()}$("modal").classList.remove("open");renderScan()}
}

async function loadOCR(){
 if(window.Tesseract)return window.Tesseract;
 return new Promise((resolve,reject)=>{const s=document.createElement("script");s.src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js";s.onload=()=>resolve(window.Tesseract);s.onerror=reject;document.head.appendChild(s)})
}
function preprocess(file,mode="normal"){
 return new Promise(resolve=>{
  const img=new Image(),url=URL.createObjectURL(file);
  img.onload=()=>{
   const w=img.naturalWidth,h=img.naturalHeight;
   const target=Math.min(4200,Math.max(w,h)*2.2);
   const scale=Math.max(1,target/Math.max(w,h));
   const c=document.createElement("canvas"); c.width=Math.round(w*scale); c.height=Math.round(h*scale);
   const x=c.getContext("2d",{willReadFrequently:true});
   x.imageSmoothingEnabled=true; x.imageSmoothingQuality="high";
   x.drawImage(img,0,0,c.width,c.height);
   const im=x.getImageData(0,0,c.width,c.height),d=im.data;
   for(let i=0;i<d.length;i+=4){
    const g=(0.299*d[i]+0.587*d[i+1]+0.114*d[i+2]);
    let v=g;
    if(mode==="high") v=Math.max(0,Math.min(255,(g-128)*1.75+128));
    else if(mode==="bw") v=g>155?255:0;
    else v=Math.max(0,Math.min(255,(g-128)*1.35+128));
    d[i]=d[i+1]=d[i+2]=v;
   }
   x.putImageData(im,0,0);
   c.toBlob(b=>{URL.revokeObjectURL(url);resolve(b||file)},"image/jpeg",.95);
  };
  img.src=url;
 })
}
async function handleFile(file){
 if(!file)return;
 const pendingReceiptId=(crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random().toString(16).slice(2));
 currentBill={receiptId:pendingReceiptId};
 try{await saveReceiptRecord(file,{id:pendingReceiptId,shop:"Unprocessed receipt",date:today()});}catch(e){console.warn("Could not save receipt image",e)}
 renderReceipts();
 $("status").textContent="Preparing receipt…";
 try{$("preview").src=URL.createObjectURL(file);$("preview").style.display="block";}catch(e){}
 scanEntries=[];$("billInfo").innerHTML="";renderScan();
 try{
  const T=await loadOCR();
  $("status").textContent="Reading receipt…";
  // Multiple layouts and preprocessing passes. A failed OCR pass must NOT abort the whole scan.
  // Tesseract recommends adequate resolution/rescaling and different segmentation modes for receipts.
  const attempts=[
   ["normal",6],["high",6],["normal",11],["high",11],["normal",4],["bw",6]
  ];
  let best={items:[],shop:"Unknown shop",date:today()};
  let lastError=null;
  for(let ai=0;ai<attempts.length;ai++){
   const [mode,psm]=attempts[ai];
   try{
    $("status").textContent=`Reading receipt… ${ai+1}/${attempts.length}`;
    const processed=await preprocess(file,mode);
    const r=await T.recognize(processed,"eng",{
      logger:m=>{if(m.status==="recognizing text")$("status").textContent=`Reading receipt… ${ai+1}/${attempts.length} ${Math.round((m.progress||0)*100)}%`;},
      tessedit_pageseg_mode:String(psm),
      preserve_interword_spaces:"1"
    });
    const raw=r?.data?.text||"";
    const parsed=parseReceipt(raw);
    parsed._ocrText=raw;
    // Prefer a pass with more real-looking items; if counts tie, prefer one with bill totals.
    const score=(parsed.items?.length||0)*100+(parsed.total!=null?20:0)+(parsed.subtotal!=null?10:0)+(parsed.shop&&parsed.shop!=="Unknown shop"?5:0);
    const bestScore=(best.items?.length||0)*100+(best.total!=null?20:0)+(best.subtotal!=null?10:0)+(best.shop&&best.shop!=="Unknown shop"?5:0);
    if(score>bestScore)best=parsed;
    if(best.items.length>=11)break;
   }catch(attemptError){
    lastError=attemptError;
    console.warn("OCR attempt failed",mode,psm,attemptError);
   }
  }
  const receiptId=currentBill?.receiptId||pendingReceiptId;
  currentBill=best;
  currentBill.receiptId=receiptId;
  currentBill.id=billId(currentBill);
  if(!currentBill.items?.length){
    await updateSavedReceiptMeta().catch(()=>{});
    $("status").textContent=lastError?"OCR could not complete. Please try the same receipt again or use a clearer/cropped photo.":"No receipt items were detected. Please try a closer, well-lit photo.";
    $("billInfo").innerHTML=`<div class="notice">The receipt image has been saved in <b>Receipts</b>, but no items were detected. Try uploading a close-up of the receipt without the surrounding background.</div>`;
    return;
  }
  await updateSavedReceiptMeta();
  scanEntries=currentBill.items;
  $("billInfo").innerHTML=`<div class="billbox">
  <div class="field" style="margin-bottom:10px">
    <label>Shop name — amend if needed</label>
    <input id="billShopEdit" value="${esc(currentBill.shop)}" placeholder="Enter shop name">
  </div>
  <div class="billrow"><span>Date</span><b>${esc(currentBill.date)}</b></div>${currentBill.subtotal!=null?`<div class="billrow"><span>Subtotal</span><b>MVR ${currentBill.subtotal.toFixed(2)}</b></div>`:""}${currentBill.tax!=null?`<div class="billrow"><span>GST / Tax</span><b>MVR ${currentBill.tax.toFixed(2)}</b></div>`:""}
  ${currentBill.discount!=null?`<div class="billrow"><span>Discount</span><b>− MVR ${currentBill.discount.toFixed(2)}</b></div>`:""}
  ${currentBill.pointsUsed!=null?`<div class="billrow"><span>Customer points used</span><b>MVR ${currentBill.pointsUsed.toFixed(2)}</b></div>`:""}
  ${currentBill.total!=null?`<div class="billrow total"><span>Total paid</span><b>MVR ${currentBill.total.toFixed(2)}</b></div>`:""}<div class="status" style="margin-top:8px">Spending uses the bill total, including GST / tax.</div></div>`;
  const dup=scanEntries.length&&scanEntries.every(x=>x.added);
  $("status").textContent=dup?"Duplicate/previously scanned bill detected. No new items found.":`Read ${scanEntries.length} item(s). Review and add missing items.`;
  renderScan();
  const shopEdit=$("billShopEdit");
  if(shopEdit){
    shopEdit.addEventListener("input",()=>{
      currentBill.shop=shopEdit.value.trim();
      currentBill.id=billId(currentBill);
      scanEntries.forEach(x=>x.shop=currentBill.shop);
      updateSavedReceiptMeta();
      renderScan();
    });
  }
 }catch(e){
  console.error(e);
  $("status").textContent="Receipt could not be read. The image is saved in Receipts. Please try again with a closer/cropped photo.";
  $("billInfo").innerHTML='<div class="notice">The receipt image was saved. OCR failed before any items could be extracted.</div>';
 }
}

load();applyAutoCategories();render();renderItemSearch();renderShopping();renderReceipts();
const importedFromReminders=importShoppingFromUrl();
if(importedFromReminders>0){renderShopping();showReminderImportStatus(importedFromReminders);}
else if(new URLSearchParams(location.search).has("shopping")||new URLSearchParams(location.search).has("items")||new URLSearchParams(location.search).has("item")){renderShopping();showReminderImportStatus(0);}
