<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Price Log</title>
<style>
:root{
  --ink:#0E2E2C; --paper:#F6F3EA; --line:#D8D2BF;
  --teal:#0E5148; --teal-dim:#3E6E67; --coral:#E0623F;
  --card:#FFFEFA; --good:#1E6B4F;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink:#EDEAE0; --paper:#101817; --line:#2A3634;
    --teal:#5FBBA9; --teal-dim:#8FA9A4; --coral:#F0876A;
    --card:#16201F; --good:#4FCB9A;
  }
}
:root[data-theme="dark"]{
  --ink:#EDEAE0; --paper:#101817; --line:#2A3634;
  --teal:#5FBBA9; --teal-dim:#8FA9A4; --coral:#F0876A;
  --card:#16201F; --good:#4FCB9A;
}
*{box-sizing:border-box;}
html{scroll-padding-top:env(safe-area-inset-top,0px); height:100%;}
body{
  margin:0; min-height:100%; background:var(--paper); color:var(--ink);
  font-family:"Iowan Old Style","Georgia",serif;
  -webkit-font-smoothing:antialiased;
}
header{
  padding:28px 20px 18px; border-bottom:1px solid var(--line);
}
header h1{
  margin:0 0 4px; font-size:28px; font-weight:600; letter-spacing:-0.01em;
}
header p{ margin:0; color:var(--teal-dim); font-size:14px; font-family:-apple-system,sans-serif;}
main{ max-width:640px; margin:0 auto; padding:18px 16px 60px; }

.card{
  background:var(--card); border:1px solid var(--line); border-radius:10px;
  padding:16px; margin-bottom:16px;
}
.row{ display:flex; gap:10px; flex-wrap:wrap; }
.field{ flex:1; min-width:130px; display:flex; flex-direction:column; gap:4px; }
label{ font-size:12px; color:var(--teal-dim); font-family:-apple-system,sans-serif; }
input,select{
  font-family:-apple-system,sans-serif; font-size:16px; padding:9px 10px;
  border:1px solid var(--line); border-radius:7px; background:var(--paper); color:var(--ink);
  width:100%;
}
input:focus,select:focus,button:focus{ outline:2px solid var(--teal); outline-offset:1px; }
.btnrow{ display:flex; gap:10px; margin-top:12px; flex-wrap:wrap; }
button{
  font-family:-apple-system,sans-serif; font-size:14px; font-weight:600;
  border:none; border-radius:7px; padding:11px 16px; cursor:pointer;
}
.primary{ background:var(--teal); color:var(--paper); flex:1; }
.ghost{ background:transparent; color:var(--teal); border:1px solid var(--teal); }
.scan-status{ font-family:-apple-system,sans-serif; font-size:13px; color:var(--teal-dim); margin-top:8px; }
textarea{
  width:100%; min-height:70px; margin-top:8px; font-family:-apple-system,sans-serif;
  font-size:13px; padding:8px; border-radius:7px; border:1px solid var(--line);
  background:var(--paper); color:var(--ink);
}

h2{ font-size:15px; font-family:-apple-system,sans-serif; font-weight:700;
  letter-spacing:0.01em; margin:26px 0 10px; color:var(--teal-dim); }

.item-group{ background:var(--card); border:1px solid var(--line); border-radius:10px; margin-bottom:12px; overflow:hidden; }
.item-head{ padding:12px 16px; font-size:17px; font-weight:600; border-bottom:1px solid var(--line); }
.entry{ display:flex; justify-content:space-between; align-items:center; padding:10px 16px; font-family:-apple-system,sans-serif; font-size:14px; border-bottom:1px solid var(--line); }
.entry:last-child{ border-bottom:none; }
.entry .shop{ color:var(--ink); }
.entry .date{ color:var(--teal-dim); font-size:12px; margin-left:6px; }
.entry .price{ font-weight:700; }
.entry.cheapest .price{ color:var(--good); }
.entry.cheapest .shop::after{ content:" — best price"; color:var(--good); font-weight:600; font-size:11px; }
.del{ background:none; border:none; color:var(--teal-dim); font-size:16px; padding:0 0 0 10px; cursor:pointer; }

.empty{ font-family:-apple-system,sans-serif; color:var(--teal-dim); font-size:14px; padding:20px 4px; }

.category-head{ font-family:-apple-system,sans-serif; font-size:13px; font-weight:700; color:var(--coral); margin:20px 2px 8px; }
.category-head:first-child{ margin-top:0; }

.shop-grid{ display:flex; flex-wrap:wrap; gap:10px; margin-bottom:8px; }
.shop-card{
  flex:1; min-width:150px; background:var(--card); border:1px solid var(--line); border-radius:10px;
  padding:12px 14px; font-family:-apple-system,sans-serif;
}
.shop-card.top{ border-color:var(--good); }
.shop-card .name{ font-size:15px; font-weight:700; margin-bottom:4px; }
.shop-card .name .badge{ font-size:10px; font-weight:700; color:var(--good); margin-left:6px; }
.shop-card .stat{ font-size:12px; color:var(--teal-dim); }

.candidates{ margin-top:10px; }
.cand{
  display:flex; justify-content:space-between; align-items:center; gap:8px;
  background:var(--paper); border:1px solid var(--line); border-radius:7px;
  padding:8px 10px; margin-top:6px; font-family:-apple-system,sans-serif; font-size:13px;
}
.cand.added{ opacity:0.45; }
.cand-text{ flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.cand-price{ font-weight:700; margin-left:8px; }
.cand button{ padding:6px 10px; font-size:12px; }

.tabs{ display:flex; gap:6px; margin:24px 0 12px; border-bottom:1px solid var(--line); }
.tab{
  background:none; border:none; padding:8px 4px 10px; font-family:-apple-system,sans-serif;
  font-size:15px; font-weight:700; color:var(--teal-dim); border-bottom:2px solid transparent;
  border-radius:0; cursor:pointer; margin-right:14px;
}
.tab.active{ color:var(--ink); border-bottom-color:var(--coral); }

.month-card{
  display:flex; justify-content:space-between; align-items:baseline;
  background:var(--card); border:1px solid var(--line); border-radius:10px;
  padding:14px 16px; margin-bottom:10px; font-family:-apple-system,sans-serif;
}
.month-card.current{ border-color:var(--coral); }
.month-card .label{ font-size:14px; font-weight:600; }
.month-card .label .tag{ font-size:10px; font-weight:700; color:var(--coral); margin-left:6px; }
.month-card .count{ font-size:12px; color:var(--teal-dim); display:block; margin-top:2px; }
.month-card .amount{ font-size:18px; font-weight:700; }

.stat-grid{ display:flex; flex-wrap:wrap; gap:10px; margin-bottom:16px; }
.stat-card{
  flex:1; min-width:140px; background:var(--card); border:1px solid var(--line); border-radius:12px;
  padding:14px 16px; font-family:-apple-system,sans-serif;
}
.stat-card .num{ font-size:22px; font-weight:800; color:var(--teal); }
.stat-card .lbl{ font-size:12px; color:var(--teal-dim); margin-top:2px; }
.dash-section-title{ font-family:-apple-system,sans-serif; font-size:13px; font-weight:700; color:var(--teal-dim); margin:18px 2px 8px; }
.chart-card{ background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px 12px 6px; }
.recent{ background:var(--card); border:1px solid var(--line); border-radius:12px; overflow:hidden; }
.recent .row-item{ display:flex; justify-content:space-between; padding:10px 14px; font-family:-apple-system,sans-serif; font-size:13px; border-bottom:1px solid var(--line); }
.recent .row-item:last-child{ border-bottom:none; }
.recent .row-item .who{ color:var(--teal-dim); font-size:11px; }
</style>
</head>
<body>
<header>
  <h1>Price Log</h1>
  <p>Track what things cost at different shops, from scanned bills or by hand.</p>
</header>
<main>

  <div class="card">
    <div class="row">
      <div class="field"><label for="item">Item</label><input id="item" placeholder="e.g. Rice 5kg"></div>
      <div class="field"><label for="category">Category</label><input id="category" list="categoryList" placeholder="e.g. Groceries"><datalist id="categoryList"></datalist></div>
    </div>
    <div class="row" style="margin-top:10px;">
      <div class="field"><label for="shop">Shop</label><input id="shop" placeholder="e.g. STO"></div>
      <div class="field"><label for="price">Price (MVR)</label><input id="price" type="number" step="0.01" inputmode="decimal" placeholder="0.00"></div>
    </div>
    <div class="row" style="margin-top:10px;">
      <div class="field"><label for="date">Date</label><input id="date" type="date"></div>
    </div>
    <div class="btnrow">
      <button class="primary" id="addBtn">Add entry</button>
      <button class="ghost" id="scanBtn">Scan a bill</button>
    </div>
    <input type="file" id="fileInput" accept="image/*" style="display:none">
    <div class="scan-status" id="scanStatus"></div>
    <img id="scanPreview" style="display:none; width:100%; border-radius:8px; margin-top:8px; border:1px solid var(--line);" alt="Bill photo">
    <div class="candidates" id="candidates"></div>
  </div>

  <div class="tabs">
    <button class="tab active" id="tabDash">Dashboard</button>
    <button class="tab" id="tabItems">Items</button>
    <button class="tab" id="tabShops">Shops</button>
    <button class="tab" id="tabSpending">Spending</button>
  </div>

  <div id="panelDash">
    <div id="dash"></div>
  </div>
  <div id="panelItems" style="display:none;">
    <div id="list"></div>
  </div>
  <div id="panelShops" style="display:none;">
    <div id="shopList"></div>
  </div>
  <div id="panelSpending" style="display:none;">
    <div id="spendingList"></div>
  </div>

</main>

<script>
const LS_KEY = 'price-log-entries';
const $ = s => document.querySelector(s);
let entries = [];

function load(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    entries = raw ? JSON.parse(raw) : [];
  }catch(e){ entries = []; }
}
function save(){
  try{ localStorage.setItem(LS_KEY, JSON.stringify(entries)); }catch(e){}
}

function render(){
  renderShops();
  renderItems();
  renderCategoryList();
  renderSpending();
  renderDashboard();
}

function renderDashboard(){
  const box = $('#dash');
  if(!entries.length){ box.innerHTML = '<div class="empty">No entries yet. Add one or scan a bill to see your dashboard.</div>'; return; }

  const now = new Date();
  const currentKey = now.toISOString().slice(0,7);
  const months = {};
  entries.forEach(e=>{
    const key = (e.date||'').slice(0,7);
    if(!key) return;
    months[key] = (months[key]||0) + e.price;
  });
  const thisMonthTotal = months[currentKey] || 0;
  const distinctItems = new Set(entries.map(e=>e.item.trim().toLowerCase())).size;

  // best value shop = most times cheapest, tie-break by item count
  const byItem = {};
  entries.forEach(e=>{
    const key = e.item.trim().toLowerCase();
    (byItem[key]=byItem[key]||[]).push(e);
  });
  const shopWins = {};
  Object.values(byItem).forEach(rows=>{
    const min = Math.min(...rows.map(r=>r.price));
    new Set(rows.filter(r=>r.price===min).map(r=>r.shop.trim())).forEach(s=> shopWins[s]=(shopWins[s]||0)+1);
  });
  const bestShop = Object.keys(shopWins).sort((a,b)=>shopWins[b]-shopWins[a])[0] || '—';

  // last 6 months, oldest to newest, for the chart
  const chartKeys = [];
  for(let i=5;i>=0;i--){
    const d = new Date(now.getFullYear(), now.getMonth()-i, 1);
    chartKeys.push(d.toISOString().slice(0,7));
  }
  const chartVals = chartKeys.map(k=>months[k]||0);
  const max = Math.max(...chartVals, 1);
  const barW = 40, gap = 14, chartH = 90, w = chartKeys.length*(barW+gap);
  const bars = chartKeys.map((k,i)=>{
    const h = Math.max(2, (chartVals[i]/max)*chartH);
    const x = i*(barW+gap);
    const label = new Date(+k.slice(0,4), +k.slice(5,7)-1, 1).toLocaleDateString('en-US',{month:'short'});
    const isCur = k===currentKey;
    return `<rect x="${x}" y="${chartH-h}" width="${barW}" height="${h}" rx="4" fill="${isCur?'var(--coral)':'var(--teal)'}" opacity="${isCur?1:0.55}"/>
      <text x="${x+barW/2}" y="${chartH+16}" font-size="10" text-anchor="middle" fill="var(--teal-dim)" font-family="-apple-system,sans-serif">${label}</text>`;
  }).join('');

  const recent = entries.slice().sort((a,b)=> (b.date||'').localeCompare(a.date||'')).slice(0,5);
  const recentHtml = recent.map(e=>`
    <div class="row-item"><span>${esc(e.item)}<span class="who"> · ${esc(e.shop)}</span></span><span>MVR ${e.price.toFixed(2)}</span></div>
  `).join('');

  box.innerHTML = `
    <div class="stat-grid">
      <div class="stat-card"><div class="num">MVR ${thisMonthTotal.toFixed(0)}</div><div class="lbl">Spent this month</div></div>
      <div class="stat-card"><div class="num">${distinctItems}</div><div class="lbl">Items tracked</div></div>
      <div class="stat-card"><div class="num">${esc(bestShop)}</div><div class="lbl">Best value shop</div></div>
    </div>
    <div class="dash-section-title">Last 6 months</div>
    <div class="chart-card"><svg viewBox="0 0 ${w} ${chartH+22}" style="width:100%; height:${chartH+22}px;">${bars}</svg></div>
    <div class="dash-section-title">Recent entries</div>
    <div class="recent">${recentHtml}</div>
  `;
}

function renderSpending(){
  const box = $('#spendingList');
  if(!entries.length){ box.innerHTML = '<div class="empty">No entries yet.</div>'; return; }
  const months = {};
  entries.forEach(e=>{
    const key = (e.date || '').slice(0,7); // YYYY-MM
    if(!key) return;
    (months[key] = months[key] || {total:0, count:0});
    months[key].total += e.price;
    months[key].count += 1;
  });
  const now = new Date();
  const currentKey = now.toISOString().slice(0,7);
  const keys = Object.keys(months).sort((a,b)=> b.localeCompare(a));
  box.innerHTML = keys.map(k=>{
    const [y,m] = k.split('-');
    const label = new Date(+y, +m-1, 1).toLocaleDateString('en-US', {month:'long', year:'numeric'});
    const d = months[k];
    return `<div class="month-card ${k===currentKey?'current':''}">
      <div><span class="label">${label}${k===currentKey?'<span class="tag">THIS MONTH</span>':''}</span>
      <span class="count">${d.count} entr${d.count===1?'y':'ies'}</span></div>
      <div class="amount">MVR ${d.total.toFixed(2)}</div>
    </div>`;
  }).join('');
}

function renderShops(){
  const box = $('#shopList');
  if(!entries.length){ box.innerHTML = ''; return; }
  // distinct items per shop, and how often each shop has the lowest price for an item
  const byItem = {};
  entries.forEach(e=>{
    const key = e.item.trim().toLowerCase();
    (byItem[key] = byItem[key] || []).push(e);
  });
  const shopItems = {}, shopWins = {};
  Object.values(byItem).forEach(rows=>{
    const min = Math.min(...rows.map(r=>r.price));
    const seen = new Set();
    rows.forEach(r=>{
      const shop = r.shop.trim();
      if(!seen.has(shop)){ shopItems[shop] = (shopItems[shop]||0)+1; seen.add(shop); }
    });
    const winners = new Set(rows.filter(r=>r.price===min).map(r=>r.shop.trim()));
    winners.forEach(s=> shopWins[s] = (shopWins[s]||0)+1);
  });
  const shops = Object.keys(shopItems).sort((a,b)=> shopItems[b]-shopItems[a]);
  const topCount = shopItems[shops[0]];
  box.innerHTML = `<div class="shop-grid">${shops.map(s=>`
    <div class="shop-card ${shopItems[s]===topCount?'top':''}">
      <div class="name">${esc(s)}${shopItems[s]===topCount?'<span class="badge">MOST ITEMS</span>':''}</div>
      <div class="stat">${shopItems[s]} item${shopItems[s]===1?'':'s'} logged</div>
      <div class="stat">Cheapest on ${shopWins[s]||0} item${(shopWins[s]||0)===1?'':'s'}</div>
    </div>`).join('')}</div>`;
}

function renderItems(){
  const list = $('#list');
  if(!entries.length){
    list.innerHTML = '<div class="empty">No entries yet. Add one above, or scan a bill to get started.</div>';
    return;
  }
  const cats = {};
  entries.forEach((e,i)=>{
    const cat = (e.category || 'Uncategorized').trim() || 'Uncategorized';
    (cats[cat] = cats[cat] || {}).__all = true;
    const key = e.item.trim().toLowerCase();
    cats[cat][key] = cats[cat][key] || [];
    cats[cat][key].push({...e, idx:i});
  });
  const catNames = Object.keys(cats).sort((a,b)=> a==='Uncategorized'?1:b==='Uncategorized'?-1:a.localeCompare(b));
  list.innerHTML = catNames.map(cat=>{
    const groups = cats[cat];
    const itemKeys = Object.keys(groups).filter(k=>k!=='__all').sort((a,b)=>a.localeCompare(b));
    const groupsHtml = itemKeys.map(key=>{
      const rows = groups[key].slice().sort((a,b)=>a.price-b.price);
      const min = rows[0].price;
      const label = groups[key][0].item;
      const body = rows.map(r=>`
        <div class="entry ${r.price===min?'cheapest':''}">
          <div><span class="shop">${esc(r.shop)}</span><span class="date">${r.date}</span></div>
          <div style="display:flex;align-items:center;">
            <span class="price">MVR ${r.price.toFixed(2)}</span>
            <button class="del" data-idx="${r.idx}" title="Delete">×</button>
          </div>
        </div>`).join('');
      return `<div class="item-group"><div class="item-head">${esc(label)}</div>${body}</div>`;
    }).join('');
    return `<div class="category-head">${esc(cat)}</div>${groupsHtml}`;
  }).join('');
  list.querySelectorAll('.del').forEach(b=>{
    b.addEventListener('click', ()=>{
      entries.splice(+b.dataset.idx,1);
      save(); render();
    });
  });
}

function renderCategoryList(){
  const dl = $('#categoryList');
  const cats = [...new Set(entries.map(e=>(e.category||'').trim()).filter(Boolean))].sort();
  dl.innerHTML = cats.map(c=>`<option value="${esc(c)}">`).join('');
}
function esc(s){ return (s||'').replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

$('#date').value = new Date().toISOString().slice(0,10);

$('#addBtn').addEventListener('click', ()=>{
  const item = $('#item').value.trim();
  const category = $('#category').value.trim();
  const shop = $('#shop').value.trim();
  const price = parseFloat($('#price').value);
  const date = $('#date').value || new Date().toISOString().slice(0,10);
  if(!item || !shop || isNaN(price)){
    $('#scanStatus').textContent = 'Fill in item, shop and price to add an entry.';
    return;
  }
  entries.push({item, category, shop, price, date});
  save(); render();
  $('#item').value=''; $('#shop').value=''; $('#price').value='';
  $('#scanStatus').textContent = 'Added.';
});

let scanEntries = []; // {shop, item, price, date}

function ensureTesseract(cb, onFail){
  if(window.Tesseract) return cb();
  const s = document.createElement('script');
  s.src = 'https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';
  s.onload = cb;
  s.onerror = onFail;
  document.head.appendChild(s);
}

function withTimeout(promise, ms){
  return Promise.race([
    promise,
    new Promise((_,rej)=> setTimeout(()=>rej(new Error('timeout')), ms))
  ]);
}

function guessShop(lines){
  for(const l of lines){
    const t = l.trim();
    if(t.length > 3 && /[A-Za-z]/.test(t) && !/^(date|time|item|qty|total|register|cashier|type|temp)/i.test(t)) return t;
  }
  return '';
}
function guessDate(text){
  const m = text.match(/(\d{1,2})[-\/](\d{1,2})[-\/](\d{2,4})/);
  if(!m) return $('#date').value;
  let [_, a, b, y] = m;
  if(y.length===2) y = '20'+y;
  // receipt showed DD-MM-YY, so treat first as day, second as month
  return `${y}-${b.padStart(2,'0')}-${a.padStart(2,'0')}`;
}

function renderCandidates(){
  const box = $('#candidates');
  if(!scanEntries.length){ box.innerHTML = ''; return; }
  box.innerHTML = `<div style="font-family:-apple-system,sans-serif;font-size:12px;color:var(--teal-dim);margin-bottom:4px;">Found ${scanEntries.length} line${scanEntries.length===1?'':'s'} with a price — tap to add:</div>
    <div class="btnrow" style="margin:0 0 6px;"><button class="primary" id="addAllBtn">Add all</button></div>
    ${scanEntries.map((c,i)=>`
      <div class="cand ${c.added?'added':''}" data-i="${i}">
        <span class="cand-text">${esc(c.item)} <span style="color:var(--teal-dim);">· ${esc(c.shop)}</span></span>
        <span class="cand-price">${c.price.toFixed(2)}</span>
        <button class="ghost" data-add="${i}" ${c.added?'disabled':''}>${c.added?'Added':'Add'}</button>
      </div>`).join('')}`;
  box.querySelectorAll('[data-add]').forEach(b=>{
    b.addEventListener('click', ()=>{
      const i = +b.dataset.add;
      addCandidate(i);
    });
  });
  const allBtn = $('#addAllBtn');
  if(allBtn) allBtn.addEventListener('click', ()=>{
    scanEntries.forEach((c,i)=>{ if(!c.added) addCandidate(i); });
  });
}
function addCandidate(i){
  const c = scanEntries[i];
  if(c.added) return;
  entries.push({item:c.item, category:$('#category').value.trim(), shop:c.shop, price:c.price, date:c.date});
  c.added = true;
  save(); render(); renderCandidates();
}

$('#scanBtn').addEventListener('click', ()=> $('#fileInput').click());
$('#fileInput').addEventListener('change', (e)=>{
  const file = e.target.files[0];
  if(!file) return;
  const status = $('#scanStatus'), img = $('#scanPreview');
  scanEntries = [];
  renderCandidates();
  const url = URL.createObjectURL(file);
  img.src = url;
  img.style.display = 'block';
  status.textContent = 'Loading scanner…';

  const fallback = ()=>{
    status.textContent = "Automatic reading isn't available in this preview — read the prices off the photo below and enter them, or host this app yourself for automatic scanning.";
  };

  ensureTesseract(()=>{
    status.textContent = 'Reading bill…';
    withTimeout(Tesseract.recognize(file, 'eng'), 25000)
      .then(({data})=>{
        const text = data.text || '';
        const lines = text.split('\n').map(l=>l.trim()).filter(Boolean);
        const shop = guessShop(lines) || $('#shop').value.trim() || 'Unknown shop';
        const date = guessDate(text);
        const found = [];
        const isNoise = /(sub\s*total|total|cash|change|tax|gst|g\.s\.t|amount|balance|tender|card|visa|master|debit|credit|payment|due|discount|round|qty|item)/i;
        lines.forEach((line, i)=>{
          const m = line.match(/(\d{1,4}[.,]\d{2})(?!.*\d[.,]\d{2})/);
          if(!m) return;
          const price = parseFloat(m[1].replace(',', '.'));
          if(isNaN(price) || price<=0) return;
          let name = line.slice(0, m.index).replace(/[|_\-–—]+$/,'').trim();
          name = name.replace(/\b\d+\s*(pcs|pc|kg|g|ml|l)\b\.?/gi,'').trim();
          if(!name){
            // price sat on its own line — borrow the nearest earlier line that isn't itself a price/noise line
            for(let j=i-1; j>=0 && j>=i-2; j--){
              const prev = lines[j].replace(/\b\d+\s*(pcs|pc|kg|g|ml|l)\b\.?/gi,'').trim();
              if(prev && !/\d[.,]\d{2}/.test(prev) && !isNoise.test(prev)){ name = prev; break; }
            }
          }
          if(!name || isNoise.test(name)) return;
          found.push({shop, item:name, price, date, added:false});
        });
        if(!found.length){
          status.textContent = "Read the photo but couldn't find clear item lines — enter them below instead.";
          return;
        }
        scanEntries = found;
        status.textContent = `Read ${found.length} item${found.length===1?'':'s'} from the bill. Review and tap to add.`;
        renderCandidates();
      })
      .catch(fallback);
  }, fallback);
});

load(); render();

function showTab(name){
  const tabs = {dash:['tabDash','panelDash'], items:['tabItems','panelItems'], shops:['tabShops','panelShops'], spending:['tabSpending','panelSpending']};
  Object.keys(tabs).forEach(k=>{
    const [tabId, panelId] = tabs[k];
    $('#'+tabId).classList.toggle('active', k===name);
    $('#'+panelId).style.display = (k===name) ? '' : 'none';
  });
}
$('#tabDash').addEventListener('click', ()=> showTab('dash'));
$('#tabItems').addEventListener('click', ()=> showTab('items'));
$('#tabShops').addEventListener('click', ()=> showTab('shops'));
$('#tabSpending').addEventListener('click', ()=> showTab('spending'));
</script>
