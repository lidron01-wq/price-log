<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0E5148">
<title>Price Log</title>
<style>
:root{--ink:#0E2E2C;--paper:#F6F3EA;--line:#D8D2BF;--teal:#0E5148;--dim:#3E6E67;--coral:#E0623F;--card:#FFFEFA;--good:#1E6B4F}
@media(prefers-color-scheme:dark){:root{--ink:#EDEAE0;--paper:#101817;--line:#2A3634;--teal:#5FBBA9;--dim:#8FA9A4;--coral:#F0876A;--card:#16201F;--good:#4FCB9A}}
*{box-sizing:border-box}html{height:100%}body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{padding:28px 20px 18px;border-bottom:1px solid var(--line)}h1{margin:0 0 4px;font:600 28px Georgia,serif}header p{margin:0;color:var(--dim);font-size:14px}
main{max-width:700px;margin:auto;padding:18px 16px 60px}.card,.item-group,.shop-card,.month-card,.stat-card,.chart-card,.recent{background:var(--card);border:1px solid var(--line);border-radius:12px}
.card{padding:16px;margin-bottom:16px}.row{display:flex;gap:10px;flex-wrap:wrap}.field{flex:1;min-width:130px;display:flex;flex-direction:column;gap:4px}label{font-size:12px;color:var(--dim)}
input,select,textarea{font:16px -apple-system,sans-serif;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink);width:100%}
.btnrow{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}button{font:600 14px -apple-system,sans-serif;border:0;border-radius:8px;padding:11px 15px;cursor:pointer}
.primary{background:var(--teal);color:var(--paper);flex:1}.ghost{background:transparent;color:var(--teal);border:1px solid var(--teal)}.danger{color:#b33;background:transparent;border:1px solid #b33}.small{padding:7px 10px;font-size:12px}
.status{font-size:13px;color:var(--dim);margin-top:9px}.preview{display:none;width:100%;max-height:300px;object-fit:contain;margin-top:10px;border:1px solid var(--line);border-radius:8px}
.last-bill-card{margin:16px 0;padding:16px;border:1px solid var(--line);border-radius:16px;background:color-mix(in srgb,var(--card) 88%,transparent)}
.last-bill-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
.last-bill-title{font-weight:800;font-size:17px;margin-bottom:4px}
.last-bill-shop{font-weight:700;font-size:15px;margin-bottom:3px}
@media(max-width:520px){.last-bill-head{align-items:flex-start;flex-direction:column}.last-bill-head .danger{width:100%}}
.tabs{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px;position:sticky;bottom:8px;z-index:20;padding:7px;background:color-mix(in srgb,var(--card) 94%,transparent);border:1px solid var(--line);border-radius:16px;margin:24px 0 14px;box-shadow:0 8px 24px rgba(0,0,0,.14);backdrop-filter:blur(12px)}.tab{position:relative;background:transparent;color:var(--dim);border:0;border-radius:11px;padding:10px 2px;min-height:46px;white-space:nowrap;font-size:10px;font-weight:650;line-height:1.1}.tab.active{background:var(--teal);color:var(--paper);box-shadow:0 3px 10px rgba(0,0,0,.12)}.tab .count{position:absolute;top:3px;right:3px;display:inline-flex;min-width:16px;height:16px;padding:0 3px;align-items:center;justify-content:center;margin:0;border-radius:99px;font-size:9px;font-weight:700;background:color-mix(in srgb,var(--dim) 18%,transparent);color:inherit}.tab.active .count{background:rgba(255,255,255,.2)}@media(max-width:430px){.tabs{gap:3px;padding:6px}.tab{font-size:9.5px;padding:10px 1px;min-height:44px}.tab .count{top:2px;right:2px;min-width:15px;height:15px;padding:0 3px;font-size:8px}}
.tab-content{min-height:20px}.tab-content section{width:100%}.empty{color:var(--dim);font-size:14px;padding:20px 4px}.category-head{font-size:13px;font-weight:700;color:var(--coral);margin:18px 2px 8px}.item-group{overflow:hidden;margin-bottom:12px}.item-head{padding:12px 14px;font-weight:700;border-bottom:1px solid var(--line)}.entry{display:flex;justify-content:space-between;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);font-size:14px}.entry:last-child{border:0}.date{color:var(--dim);font-size:11px}.price{font-weight:700}.entry-actions{display:flex;gap:5px;align-items:center}.entry-actions button{padding:5px 8px;font-size:12px}
.candidates{margin-top:12px}.cand{display:flex;align-items:center;gap:7px;padding:9px;margin-top:6px;border:1px solid var(--line);border-radius:8px;background:var(--paper)}.cand.new{border-color:var(--good)}.cand-text{flex:1;overflow:hidden;text-overflow:ellipsis}.cand-price{font-weight:700;white-space:nowrap}.badge{font-size:10px;padding:3px 5px;border-radius:5px;background:var(--good);color:white}.pos-bill{margin-top:12px;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--paper)}.pos-head,.pos-line{display:grid;grid-template-columns:minmax(0,1fr) 58px 92px 78px 34px;gap:7px;align-items:center}.pos-head{padding:9px 10px;background:color-mix(in srgb,var(--card) 82%,transparent);color:var(--dim);font-size:11px;font-weight:800;text-transform:uppercase}.pos-line{padding:9px 10px;border-top:1px solid var(--line)}.pos-line input{padding:7px 6px;border-radius:7px;font-size:13px;min-width:0}.pos-line .pos-name{font-weight:650}.pos-remove{padding:6px 0;min-width:30px}.pos-add{margin:10px}.pos-summary{border-top:1px solid var(--line);padding:12px 10px;background:color-mix(in srgb,var(--card) 82%,transparent)}.pos-summary .billrow{padding:4px 0}.pos-summary .billrow input{max-width:150px}.pos-total{font-size:18px;font-weight:850;border-top:1px solid var(--line);margin-top:6px;padding-top:9px}.submit-bill{width:100%;font-size:15px;padding:13px;margin-top:10px}.draft-note{font-size:12px;color:var(--dim);margin:8px 0}.draft-actions{display:flex;gap:8px;margin-top:10px}.draft-actions button{flex:1}@media(max-width:430px){.pos-head,.pos-line{grid-template-columns:minmax(0,1fr) 48px 78px 68px 30px;gap:5px}.pos-head{font-size:9px}.pos-line input{font-size:12px;padding:7px 5px}}
.billbox{margin-top:12px;border-top:1px solid var(--line);padding-top:12px}.billrow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:5px 0}.billrow.total{font-weight:800;font-size:17px;border-top:1px solid var(--line);margin-top:5px;padding-top:9px}.billrow input{max-width:180px;text-align:right;padding:8px}.bill-tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.bill-add-box{margin-top:10px;padding:12px;border:1px dashed var(--line);border-radius:10px;background:color-mix(in srgb,var(--paper) 70%,transparent)}.history-note{font-size:12px;color:var(--dim);margin:8px 0 12px}
.stat-grid{display:flex;gap:10px;flex-wrap:wrap}.stat-card{flex:1;min-width:140px;padding:14px}.num{font-size:21px;font-weight:800;color:var(--teal)}.lbl{font-size:12px;color:var(--dim);margin-top:2px}.shop-grid{display:flex;flex-wrap:wrap;gap:10px}.shop-card{flex:1;min-width:160px;padding:13px}.shop-card .name{font-weight:700}.shop-card .stat{font-size:12px;color:var(--dim);margin-top:3px}.month-card{display:flex;justify-content:space-between;padding:14px;margin-bottom:9px}.month-card .count{display:block;font-size:12px;color:var(--dim);margin-top:3px}.recent{overflow:hidden}.recent div{display:flex;justify-content:space-between;padding:10px 14px;border-bottom:1px solid var(--line);font-size:13px}.recent div:last-child{border:0}

.search-card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:16px}.search-title{font-weight:700;font-size:14px;margin-bottom:7px}.search-results{margin-top:10px}.search-result{padding:11px 0;border-top:1px solid var(--line)}.search-result:first-child{border-top:0}.search-item-title{font-weight:700;margin-bottom:5px}.shop-price{display:flex;justify-content:space-between;gap:10px;font-size:13px;padding:3px 0}.shop-price .cheap{color:var(--good);font-weight:800}.match-note{font-size:12px;color:var(--dim);margin-top:3px}.list-card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:12px}.compare-shop{border:1px solid var(--line);border-radius:10px;padding:12px;margin-top:8px;background:var(--paper)}.compare-shop.top{border-color:var(--good)}.compare-shop .shop-name{font-weight:800}.compare-items{margin-top:8px;font-size:12px;color:var(--dim)}
.modal{display:none;position:fixed;inset:0;background:#0008;z-index:20;align-items:flex-end;justify-content:center}.modal.open{display:flex}.modalbox{width:min(700px,100%);background:var(--card);border-radius:16px 16px 0 0;padding:18px;max-height:90vh;overflow:auto}.modal h3{margin-top:0}
.notice{padding:10px;border-radius:8px;background:color-mix(in srgb,var(--coral) 15%,transparent);font-size:13px;margin-top:10px}.receipt-card{display:flex;gap:12px;padding:12px;border:1px solid var(--line);border-radius:10px;margin:8px 0;background:var(--card)}.receipt-thumb{width:86px;height:110px;object-fit:cover;border-radius:7px;border:1px solid var(--line);background:var(--paper)}.receipt-meta{flex:1;min-width:0}.receipt-meta b{display:block;margin-bottom:4px}.receipt-meta .muted{color:var(--dim);font-size:12px;margin:2px 0}.receipt-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}

/* ===== POS bill editor ===== */
.pv{position:fixed;inset:0;z-index:60;display:none;justify-content:center;background:var(--paper);color:var(--ink)}
.pv.open{display:flex}
.pv-in{width:min(720px,100%);height:100%;display:flex;flex-direction:column;min-height:0}
.pv-head{padding:calc(10px + env(safe-area-inset-top,0px)) 14px 10px;background:var(--card);border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.pv-bar{display:flex;align-items:center;gap:10px}
.pv-x{background:transparent;color:var(--ink);border:1px solid var(--line);width:38px;height:38px;padding:0;font-size:16px}
.pv-title{flex:1;font-weight:800;font-size:17px;line-height:1.2}
.pv-title small{display:block;font-weight:500;font-size:11px;color:var(--dim);margin-top:1px}
.pv-chip{font-size:12px;font-weight:700;background:var(--teal);color:var(--paper);padding:5px 9px;border-radius:99px;white-space:nowrap}
.pv-row2{display:grid;grid-template-columns:150px 1fr;gap:8px}
.pv-head input{padding:9px 10px}
.pv-compose{padding:10px 14px;background:color-mix(in srgb,var(--teal) 9%,var(--paper));border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.pv-cgrid{display:grid;grid-template-columns:62px 1fr 1fr auto;gap:8px}
.pv-cgrid input{padding:10px 8px;text-align:center}
.pv-cgrid button{padding:0 16px}
.pv-list{flex:1;min-height:0;overflow-y:auto;padding:12px 14px;display:flex;flex-direction:column;gap:10px;-webkit-overflow-scrolling:touch}
.pv-empty{margin:auto;text-align:center;color:var(--dim);font-size:14px;line-height:1.6}
.pv-line{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px}
.pv-top{display:flex;gap:8px}
.pv-name{font-weight:700}
.pv-del{background:transparent;color:var(--coral);border:1px solid var(--line);width:42px;padding:0;flex:none}
.pv-grid{display:grid;grid-template-columns:1.15fr 1fr .8fr;gap:8px;margin-top:8px}
.pv-f{display:flex;flex-direction:column;gap:3px;min-width:0}
.pv-f label{font-size:11px;color:var(--dim)}
.pv-grid input,.pv-tgrid input{padding:9px 8px;text-align:right}
.pv-step{display:grid;grid-template-columns:34px 1fr 34px;gap:4px}
.pv-step button{padding:0;background:var(--paper);color:var(--teal);border:1px solid var(--line);font-size:18px;line-height:1}
.pv-step input{text-align:center;padding:9px 2px}
.pv-meta{display:flex;justify-content:space-between;align-items:center;margin-top:7px;font-size:12px;color:var(--dim)}
.pv-badge{font-size:10px;font-weight:700;padding:3px 7px;border-radius:99px}
.pv-badge.new{background:color-mix(in srgb,var(--good) 18%,transparent);color:var(--good)}
.pv-badge.rec{background:color-mix(in srgb,var(--dim) 20%,transparent);color:var(--dim)}
.pv-foot{background:var(--card);border-top:1px solid var(--line);padding:10px 14px calc(12px + env(safe-area-inset-bottom,0px));box-shadow:0 -6px 20px rgba(0,0,0,.12)}
.pv-hint{font-size:12px;color:var(--dim);margin-bottom:8px;min-height:16px}
.pv-tgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pv-final{display:grid;grid-template-columns:1fr 1.1fr;gap:10px;align-items:end;margin-top:10px}
.pv-total{font-size:22px;font-weight:800;padding:9px 10px;color:var(--teal)}
.pv-submit{height:54px;font-size:16px;padding:0 10px}
.pv-submit:disabled{opacity:.6}
.pv-link{background:none;border:0;color:var(--teal);text-decoration:underline;padding:0 0 0 4px;font-size:12px;font-weight:600;display:none}
#pvHint .pv-link{display:inline}
.pv input.ov{border-color:var(--coral)}
.pv-peek{position:absolute;inset:0;background:#000d;display:flex;align-items:center;justify-content:center;z-index:5;overflow:auto;padding:12px}
.pv-peek img{max-width:100%;max-height:100%;object-fit:contain;border-radius:8px}
</style>
</head>
<body>
<header><h1>Price Log</h1><p>Track what things cost at different shops, from scanned bills or by hand.</p></header>
<main>
<div class="search-card">
  <div class="search-title">Find an item & compare shops</div>
  <input id="itemSearch" placeholder="Search an item, e.g. milk, chicken, shampoo..." autocomplete="off">
  <div class="search-results" id="searchResults"></div>
</div>
<div class="card">
<div class="row">
<div class="field"><label>Item</label><input id="item" placeholder="e.g. Rice 5kg"></div>
<div class="field"><label>Category</label><input id="category" list="categoryList" placeholder="e.g. Groceries"><datalist id="categoryList"></datalist></div>
</div>
<div class="row" style="margin-top:10px">
<div class="field"><label>Shop</label><input id="shop" placeholder="e.g. STO"></div>
<div class="field"><label>Price (MVR)</label><input id="price" type="number" step="0.01" inputmode="decimal" placeholder="0.00"></div>
</div>
<div class="row" style="margin-top:10px"><div class="field"><label>Date</label><input id="date" type="date"></div></div>
<div class="btnrow"><button class="primary" id="addBtn">Add entry</button><button class="ghost" id="editBtn">Edit</button></div>
<div class="btnrow"><button class="ghost" id="scanBtn">📷 Scan a bill</button><button class="ghost" id="uploadBtn">🖼 Upload bill</button><button class="ghost" id="manualBillBtn">🧾 New bill</button></div>
<input id="cameraInput" type="file" accept="image/*" capture="environment" hidden>
<input id="uploadInput" type="file" accept="image/*" hidden>
<div class="status" id="status">After scanning, you can amend the shop name before adding items.</div><img id="preview" class="preview" alt="Receipt preview">
<div id="billInfo"></div><div id="candidates" class="candidates"></div>
</div>

<div class="tabs"><button class="tab active" data-tab="dash">Dashboard <span class="count" id="tabDashCount">0</span></button><button class="tab" data-tab="items">Items <span class="count" id="tabItemsCount">0</span></button><button class="tab" data-tab="shops">Shops <span class="count" id="tabShopsCount">0</span></button><button class="tab" data-tab="spending">Spending <span class="count" id="tabSpendingCount">0</span></button><button class="tab" data-tab="shopping">Shopping <span class="count" id="tabShoppingCount">0</span></button><button class="tab" data-tab="receipts">Bills <span class="count" id="tabReceiptsCount">0</span></button></div>
<div class="tab-content"><section id="dash"></section><section id="items" style="display:none"></section><section id="shops" style="display:none"></section><section id="spending" style="display:none"></section><section id="shopping" style="display:none"></section><section id="receipts" style="display:none"></section></div>
</main>

<div id="pv" class="pv"></div>
<div id="modal" class="modal"><div class="modalbox"><h3 id="modalTitle">Edit entry</h3><div class="row"><div class="field"><label>Item</label><input id="mItem"></div><div class="field"><label>Category</label><input id="mCat"></div></div><div class="row" style="margin-top:10px"><div class="field"><label>Shop</label><input id="mShop"></div><div class="field"><label>Price</label><input id="mPrice" type="number" step=".01"></div></div><div class="field" style="margin-top:10px"><label>Date</label><input id="mDate" type="date"></div><div class="btnrow"><button class="primary" id="saveEdit">Save changes</button><button class="ghost" id="cancelEdit">Cancel</button></div></div></div>

<script>
"use strict";
const KEY="price-log-entries-v1";
const SHOPPING_KEY="price-log-shopping-v1";
let entries=[], scanEntries=[], currentEdit=-1, currentBill=null, currentReceiptFile=null, savedReceipts=[], shoppingItems=[];
const RECEIPT_DB="price-log-receipts-v1";
let receiptDb=null;

const $=id=>document.getElementById(id);
function esc(v){return String(v??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function load(){try{entries=JSON.parse(localStorage.getItem(KEY)||"[]");if(!Array.isArray(entries))entries=[]}catch(e){entries=[]}try{shoppingItems=JSON.parse(localStorage.getItem(SHOPPING_KEY)||"[]");if(!Array.isArray(shoppingItems))shoppingItems=[]}catch(e){shoppingItems=[]}}
function save(){localStorage.setItem(KEY,JSON.stringify(entries))}
function saveShopping(){localStorage.setItem(SHOPPING_KEY,JSON.stringify(shoppingItems))}
function today(){return new Date().toISOString().slice(0,10)}
$("date").value=today();

function updateTabCounts(){
 const counts={tabDashCount:entries.length,tabItemsCount:new Set(entries.map(e=>String(e.item||'').toLowerCase())).size,tabShopsCount:new Set(entries.map(e=>String(e.shop||'').toLowerCase())).size,tabSpendingCount:new Set(entries.map(e=>String(e.date||'').slice(0,7)).filter(Boolean)).size,tabShoppingCount:shoppingItems.length,tabReceiptsCount:savedReceipts.length};
 Object.entries(counts).forEach(([id,n])=>{const el=$(id);if(el)el.textContent=n});
}
function render(){
 renderItems();renderShops();renderSpending();renderDash();renderCats();renderReceipts();renderItemSearch();renderShopping();updateTabCounts();
}
function renderCats(){$("categoryList").innerHTML=[...new Set(entries.map(e=>e.category).filter(Boolean))].sort().map(x=>`<option value="${esc(x)}">`).join("")}

$("addBtn").onclick=()=>{
 const item=$("item").value.trim(),shop=$("shop").value.trim(),price=parseFloat($("price").value),date=$("date").value||today(),category=$("category").value.trim();
 if(!item||!shop||!Number.isFinite(price)){ $("status").textContent="Fill in item, shop and price.";return}
 entries.push({item,category,shop,price,date});
 save();render();$("item").value="";$("shop").value="";$("price").value="";$("status").textContent="Added.";
};
$("editBtn").onclick=()=>openEdit(-1,true);

function openEdit(i,fromForm=false){
 if(fromForm){
  if(!$("item").value.trim()){$("status").textContent="Enter an item first, or select Edit beside an existing entry.";return}
  currentEdit=-1;$("mItem").value=$("item").value;$("mCat").value=$("category").value;$("mShop").value=$("shop").value;$("mPrice").value=$("price").value;$("mDate").value=$("date").value||today();
 }else{
  const e=entries[i];if(!e)return;currentEdit=i;
  $("mItem").value=e.item;$("mCat").value=e.category||"";$("mShop").value=e.shop;$("mPrice").value=e.price;$("mDate").value=e.date||today();
 }
 $("modal").classList.add("open");
}
$("cancelEdit").onclick=()=>$("modal").classList.remove("open");
$("saveEdit").onclick=()=>{
 const e={item:$("mItem").value.trim(),category:$("mCat").value.trim(),shop:$("mShop").value.trim(),price:parseFloat($("mPrice").value),date:$("mDate").value||today()};
 if(!e.item||!e.shop||!Number.isFinite(e.price))return alert("Please complete item, shop and price.");
 if(currentEdit>=0)entries[currentEdit]=e; else {$("item").value=e.item;$("category").value=e.category;$("shop").value=e.shop;$("price").value=e.price;$("date").value=e.date}
 save();render();$("modal").classList.remove("open");
};

function normItem(s){return String(s||"").toLowerCase().replace(/[^a-z0-9\s]/g," ").replace(/\s+/g," ").trim()}
function itemMatch(a,b){
 const x=normItem(a),y=normItem(b);if(!x||!y)return false;if(x===y||x.includes(y)||y.includes(x))return true;
 const A=new Set(x.split(" ").filter(w=>w.length>2)),B=new Set(y.split(" ").filter(w=>w.length>2));
 const inter=[...A].filter(w=>B.has(w)).length;return inter>=2&&inter/Math.min(A.size,B.size)>=0.55;
}
function renderItemSearch(){
 const q=$("itemSearch")?.value.trim(),box=$("searchResults");if(!box)return;
 if(!q){box.innerHTML='<div class="match-note">Search your saved items to see the shops and prices.</div>';return}
 const matches=entries.filter(e=>itemMatch(e.item,q));
 if(!matches.length){box.innerHTML='<div class="match-note">No matching item found in your price log.</div>';return}
 const groups={};matches.forEach(e=>{const k=normItem(e.item);(groups[k]??=[]).push(e)});
 box.innerHTML=Object.values(groups).map(rows=>{
   const min=Math.min(...rows.map(e=>Number(e.price))),label=rows[0].item,unique={};
   rows.forEach(e=>{if(!unique[e.shop]||Number(e.price)<Number(unique[e.shop].price))unique[e.shop]=e});
   const shopRows=Object.values(unique).sort((a,b)=>Number(a.price)-Number(b.price));
   return `<div class="search-result"><div class="search-item-title">${esc(label)}</div>${shopRows.map(e=>`<div class="shop-price"><span>${esc(e.shop)}</span><span class="${Number(e.price)===min?'cheap':''}">MVR ${Number(e.price).toFixed(2)}${Number(e.price)===min?' · cheapest':''}</span></div>`).join("")}</div>`;
 }).join("");
}
function parseShoppingText(text){

function ihsaanNumToken(v){

function ihsaanRowLines(text){

  const idx=lines.indexOf(rows[r].numberLine);
  const next= r+1<rows.length ? lines.indexOf(rows[r+1].numberLine,idx+1) : lines.length;
  for(let j=idx+1;j<next;j++){
   const x=lines[j];
   if(/sub\s*total|discount|total\s*gst|plastic\s*bag|total\s*amount|received|balance|print\s*by|powered\s*by/i.test(x))break;

 }finally{
  submitting=false;
  if($('pvSubmit')){$('pvSubmit').disabled=false;$('pvSubmit').textContent='Submit bill';}
 }
}
$('manualBillBtn').onclick=()=>{
 currentReceiptFile=null;scanEntries=[];
 currentBill={shop:$('shop').value.trim(),date:$('date').value||today(),manual:true,items:[],subtotal:null,tax:null,total:null,discount:null};
 renderBillEditor();
};


async function loadOCR(){
 if(window.Tesseract)return window.Tesseract;
 return new Promise((resolve,reject)=>{const s=document.createElement("script");s.src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js";s.onload=()=>resolve(window.Tesseract);s.onerror=reject;document.head.appendChild(s)})
}
function preprocess(file){
 return new Promise(resolve=>{const img=new Image(),url=URL.createObjectURL(file);img.onload=()=>{const max=2200,scale=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));const c=document.createElement("canvas");c.width=Math.round(img.naturalWidth*scale);c.height=Math.round(img.naturalHeight*scale);const x=c.getContext("2d");x.filter="grayscale(1) contrast(1.35)";x.drawImage(img,0,0,c.width,c.height);c.toBlob(b=>{URL.revokeObjectURL(url);resolve(b||file)},"image/jpeg",.92)};img.src=url})
}
function openReceiptDb(){return new Promise((resolve,reject)=>{if(receiptDb)return resolve(receiptDb);const r=indexedDB.open(RECEIPT_DB,1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains("receipts"))r.result.createObjectStore("receipts",{keyPath:"id"})};r.onsuccess=()=>{receiptDb=r.result;resolve(receiptDb)};r.onerror=()=>reject(r.error)})}
function fileDataUrl(file){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(file)})}
async function saveReceiptRecord(file,bill){try{const db=await openReceiptDb(),data=file?await fileDataUrl(file):"",id=Date.now()+"-"+Math.random().toString(36).slice(2);const rec={id,image:data,shop:bill?.shop||"Unprocessed receipt",date:bill?.date||today(),subtotal:bill?.subtotal??null,tax:bill?.tax??null,discount:bill?.discount??null,pointsUsed:bill?.pointsUsed??null,total:bill?.total??null,items:bill?.items?.length||0,entryKeys:(bill?.items||[]).map(duplicateKey),createdAt:new Date().toISOString()};await new Promise((res,rej)=>{const tx=db.transaction("receipts","readwrite");tx.objectStore("receipts").put(rec);tx.oncomplete=res;tx.onerror=()=>rej(tx.error)});return rec}catch(e){console.warn("Receipt storage failed",e);return null}}
async function updateReceiptRecord(id,bill){try{const db=await openReceiptDb();await new Promise((res,rej)=>{const tx=db.transaction("receipts","readwrite"),store=tx.objectStore("receipts"),req=store.get(id);req.onsuccess=()=>{const r=req.result;if(!r){res();return}r.shop=bill?.shop||r.shop;r.date=bill?.date||r.date;r.subtotal=bill?.subtotal??r.subtotal??null;r.tax=bill?.tax??r.tax??null;r.discount=bill?.discount??r.discount??null;r.pointsUsed=bill?.pointsUsed??r.pointsUsed??null;r.total=bill?.total??r.total??null;r.items=bill?.items?.length||0;r.entryKeys=(bill?.items||[]).map(duplicateKey);store.put(r)};req.onerror=()=>rej(req.error);tx.oncomplete=res;tx.onerror=()=>rej(tx.error)});await loadReceipts()}catch(e){console.warn("Receipt metadata update failed",e)}}
async function deleteReceiptRecordOnly(id){const db=await openReceiptDb();await new Promise((res,rej)=>{const tx=db.transaction("receipts","readwrite");tx.objectStore("receipts").delete(id);tx.oncomplete=res;tx.onerror=()=>rej(tx.error)});await loadReceipts()}
async function syncCurrentReceiptRecord(){if(!currentBill?.receiptId)return;const billItems=entries.filter(e=>e.receiptId===currentBill.receiptId);await updateReceiptRecord(currentBill.receiptId,{...currentBill,items:billItems})}
async function loadReceipts(){try{const db=await openReceiptDb();savedReceipts=await new Promise((res,rej)=>{const tx=db.transaction("receipts","readonly"),req=tx.objectStore("receipts").getAll();req.onsuccess=()=>res(req.result||[]);req.onerror=()=>rej(req.error)});savedReceipts.sort((a,b)=>String(b.createdAt).localeCompare(String(a.createdAt)));renderReceipts();updateTabCounts()}catch(e){savedReceipts=[];renderReceipts();updateTabCounts()}}
async function deleteReceipt(id){if(!confirm("Delete this receipt and all of its matching price entries?"))return;const r=(savedReceipts||[]).find(x=>x.id===id);const keys=Array.isArray(r?.entryKeys)?r.entryKeys:[];if(keys.length){const keySet=new Set(keys);entries=entries.filter(e=>e.receiptId!==id&&!keySet.has(duplicateKey(e)))}else{entries=entries.filter(e=>e.receiptId!==id)}save();await deleteReceiptRecordOnly(id);render()}
function unlinkedEntries(){return entries.filter(e=>!isLinked(e))}
function deleteUnlinked(){
 const o=unlinkedEntries();if(!o.length)return;
 const shops=[...new Set(o.map(e=>e.shop||"Unknown shop"))].join(", ");
 if(!confirm(`Delete ${o.length} price record(s) that are not linked to any bill?\n\nShops: ${shops}\n\nThis also removes records you added by hand.`))return;
 entries=entries.filter(isLinked);save();render();
}
function renderReceipts(){
 const el=$("receipts");if(!el)return;
 const un=unlinkedEntries();
 const unBlock=un.length?`<div class="notice" style="margin:0 0 14px"><b>${un.length} price record${un.length===1?"":"s"} not linked to any bill</b><div class="muted" style="margin-top:4px">These are entries added by hand, or left behind from bills that were deleted earlier. They still count in Items, Shops and Spending.</div><div class="btnrow"><button class="danger small" onclick="deleteUnlinked()">Delete unlinked records</button></div></div>`:"";
 if(!savedReceipts.length){el.innerHTML=`<h3>Bill history</h3>${unBlock}<div class="empty">No bills yet. Scan, upload or enter a bill and submit it to build your bill history.</div>`;return}
 const sum=savedReceipts.reduce((t,r)=>t+(Number(r.total)||0),0);
 const money=v=>`MVR ${Number(v).toFixed(2)}`;
 el.innerHTML=`<h3>Bill history</h3><div class="history-note">${savedReceipts.length} bill${savedReceipts.length===1?"":"s"} · ${money(sum)} in total. Deleting a bill also removes its price entries and updates the totals.</div>${unBlock}`+savedReceipts.map(r=>{
  const parts=[];
  if(r.subtotal!=null)parts.push(`Subtotal ${money(r.subtotal)}`);
  if(r.tax!=null)parts.push(`GST ${money(r.tax)}`);
  if(r.discount)parts.push(`Discount −${money(r.discount)}`);
  return `<div class="receipt-card">${r.image?`<img class="receipt-thumb" src="${r.image}" alt="Receipt">`:""}<div class="receipt-meta"><b>${esc(r.shop||"Bill")}</b><div class="muted">${esc(r.date||"")} · ${r.items||0} item${(r.items||0)===1?"":"s"}</div>${parts.length?`<div class="muted">${parts.join(" · ")}</div>`:""}${r.total!=null?`<div style="font-weight:800;margin-top:3px">Total ${money(r.total)}</div>`:""}<div class="receipt-actions">${r.image?`<button class="ghost small" onclick="viewReceipt('${r.id}')">View receipt</button>`:""}<button class="danger small" onclick="deleteReceipt('${r.id}')">Delete whole bill</button></div></div></div>`}).join("");
}
function viewReceipt(id){const r=savedReceipts.find(x=>x.id===id);if(!r||!r.image)return;const w=window.open();if(w){w.document.write(`<title>${esc(r.shop||"Receipt")}</title><body style="margin:0;background:#111;display:flex;justify-content:center"><img src="${r.image}" style="max-width:100%;height:auto;object-fit:contain"></body>`);w.document.close()}}
async function handleFile(file){
 if(!file)return;
 currentReceiptFile=file;currentBill=null;scanEntries=[];
 $('status').textContent='Preparing receipt…';$('preview').src=URL.createObjectURL(file);$('preview').style.display='block';$('billInfo').innerHTML='';renderScan();
 try{
  const T=await loadOCR();$('status').textContent='Reading receipt…';
  const processed=await preprocess(file);
  const r=await T.recognize(processed,"eng",{logger:m=>{if(m.status==="recognizing text")$('status').textContent=`Reading receipt… ${Math.round((m.progress||0)*100)}%`}});
  let ocrTexts=[r.data.text||""];
  // Ihsaan's table is a ruled six-column layout. Keep the original OCR path for every
  // other shop (especially Day Night), but give this format two complementary passes.
  if(/IHSAAN\s+FIHAARA/i.test(r.data.text||"")){
    try{
      const r6=await T.recognize(processed,"eng",{tessedit_pageseg_mode:6});
      ocrTexts.push(r6.data.text||"");
    }catch(e){console.warn("Ihsaan secondary OCR failed",e)}
    currentBill=parseIhsaanCombined(ocrTexts);
  }else{
    currentBill=parseReceipt(r.data.text||"");
  }
  scanEntries=makeDraftItems(currentBill.items);
  const dup=scanEntries.length&&scanEntries.every(x=>x.originalAdded);
  currentBill.draftDuplicate=!!dup;
  if(dup){
    $('status').textContent='Duplicate/previously submitted bill detected. Review only — it will not update saved data unless you change the draft.';
  }
  $('billInfo').innerHTML=`<div class="billbox"><div class="notice">${dup?'This bill matches existing records. You can review it, but unchanged items will not be added again.':'Draft bill — review the item list, quantities, line totals and tax, then submit once you are satisfied.'}</div></div>`;
  renderBillEditor();
  $('status').textContent=`Read ${scanEntries.length} item(s). Review the draft, then submit the bill.`;
  renderScan();
 }catch(e){console.error(e);currentReceiptFile=null;$('status').textContent='Receipt could not be read. You can still use Add entry or try another photo.'}
}
load();render();loadReceipts();updateTabCounts();importShoppingFromUrl();
